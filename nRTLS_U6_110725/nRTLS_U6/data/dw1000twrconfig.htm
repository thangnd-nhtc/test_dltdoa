    <script>
        var HttpClient = function () {
            this.get = function (aUrl, aCallback) {
                var anHttpRequest = new XMLHttpRequest();
                anHttpRequest.onreadystatechange = function () {
                    if (anHttpRequest.readyState == 4 && anHttpRequest.status == 200)
                        aCallback(anHttpRequest.responseText);
                }

                anHttpRequest.open("GET", aUrl, true);
                anHttpRequest.send(null);
            }

            this.post = function (aUrl, data, aCallback) {
                var anHttpRequest = new XMLHttpRequest();
                anHttpRequest.onreadystatechange = function () {
                    if (anHttpRequest.readyState == 4 && anHttpRequest.status == 200)
                        aCallback(anHttpRequest.responseText);
                }

                anHttpRequest.open("POST", aUrl, true);
                anHttpRequest.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
                anHttpRequest.send(data);
            }
        }

        var client = new HttpClient();

        function TwrUpdate() {
            var obj = { "chan": 1 };
            var table = document.getElementById('TableTwrDw1000');
            obj.chan = Number(table.rows[0].cells[1].children[0].value);
            obj.prf = Number(table.rows[1].cells[1].children[0].value);
            obj.txPreambLength = Number(table.rows[2].cells[1].children[0].value);
            obj.rxPAC = Number(table.rows[3].cells[1].children[0].value);
            obj.txCode = Number(table.rows[4].cells[1].children[0].value);
            obj.rxCode = Number(table.rows[5].cells[1].children[0].value);
            obj.nsSFD = Number(table.rows[6].cells[1].children[0].value);
            obj.dataRate = Number(table.rows[7].cells[1].children[0].value);
            obj.phrMode = Number(table.rows[8].cells[1].children[0].value);
            obj.sfdTO = Number(table.rows[9].cells[1].children[0].value);
            obj.PGdly = table.rows[10].cells[1].children[0].value;
            obj.power = table.rows[11].cells[1].children[0].value;
            obj.Rx_Delay = Number(table.rows[12].cells[1].children[0].value);
            obj.Rx_Timeout = Number(table.rows[13].cells[1].children[0].value);
            obj.Tx_Delay = Number(table.rows[14].cells[1].children[0].value);
            obj.AntenRx_Delay = Number(table.rows[15].cells[1].children[0].value);
            obj.AntenTx_Delay = Number(table.rows[16].cells[1].children[0].value);

            var StrJSON = JSON.stringify(obj);
            console.log(StrJSON);
            client.post('/dw1000', "config=twr&json=" + StrJSON, function (response) {
                alert(response);
            });
        }

        function onBodyLoad() {
            let table = document.getElementById('tableId');
            resizableGrid(table);
            /* json = {"chan":1,"prf":1,"txPreambLength":4,"rxPAC":1,"txCode":1,"rxCode":4,"nsSFD":1,
            "dataRate":1,"phrMode":0,"sfdTO":1,"PGdly":"0x95","power":"0x1F1F1F1F"
            "Rx_Delay":1500,"Rx_Timeout":2500,"Tx_Delay":2000,"AntenRx_Delay":18355,"AntenTx_Delay":14421} */
            client.get('/dw1000?config=twr', function (response) {
                console.log(response);
                var obj = JSON.parse(response);
                var table = document.getElementById('TableTwrDw1000');
                table.rows[0].cells[1].children[0].value = obj.chan;
                table.rows[1].cells[1].children[0].value = obj.prf;
                table.rows[2].cells[1].children[0].value = obj.txPreambLength;
                table.rows[3].cells[1].children[0].value = obj.rxPAC;
                table.rows[4].cells[1].children[0].value = obj.txCode;
                table.rows[5].cells[1].children[0].value = obj.rxCode;
                table.rows[6].cells[1].children[0].value = obj.nsSFD;
                table.rows[7].cells[1].children[0].value = obj.dataRate;
                table.rows[8].cells[1].children[0].value = obj.phrMode;
                table.rows[9].cells[1].children[0].value = obj.sfdTO;
                table.rows[10].cells[1].children[0].value = obj.PGdly;
                table.rows[11].cells[1].children[0].value = obj.power;
                table.rows[12].cells[1].children[0].value = obj.Rx_Delay;
                table.rows[13].cells[1].children[0].value = obj.Rx_Timeout;
                table.rows[14].cells[1].children[0].value = obj.Tx_Delay;
                table.rows[15].cells[1].children[0].value = obj.AntenRx_Delay;
                table.rows[16].cells[1].children[0].value = obj.AntenTx_Delay;
            });
        }
